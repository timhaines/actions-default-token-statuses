name: Status Probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: 'Probe'
    runs-on: ubuntu-latest
    steps:
      - name: Post a commit status with the default GITHUB_TOKEN
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'default-token-status-probe',
              description: 'posted by the default GITHUB_TOKEN'
            });
